[alembic]
script_location = migrations

# Filenames sort chronologically and say what they do, so `ls versions/` reads
# as a history rather than a pile of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

prepend_sys_path = .
path_separator = os

# The URL deliberately lives in env.py, read from the same Settings object the
# application uses. Two sources of truth for "which database" is how you migrate
# the wrong one.

[loggers]
keys = root,sqlalchemy,alembic,alembic_plugins

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# "setup plugin alembic.autogenerate.*" on every run, seven lines of it, buries
# the one line that matters — which revision was applied.
[logger_alembic_plugins]
level = WARNING
handlers =
qualname = alembic.runtime.plugins

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
